# Fly.io configuration for AI Multichannel System
# This file configures deployment to Fly.io

app = "ai-multichannel-system"
primary_region = "iad"  # US East (N. Virginia)

# Build configuration
[build]
  dockerfile = "Dockerfile"
  target = "production"
  
# Build arguments
[build.args]
  APP_ENV = "production"

# HTTP service configuration
[[services]]
  internal_port = 8000
  protocol = "tcp"
  
  # Public HTTP endpoints
  [[services.ports]]
    handlers = ["http"]
    port = 80
    
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
    
  # Webhook endpoints for Twilio
  [[services.http_checks]]
    interval = "10s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
    
  # Auto stop/start
  [[services.auto_stop]]
    enabled = false
    stop_after = "5m"

# Database (PostgreSQL)
[[services]]
  name = "ai-multichannel-db"
  internal_port = 5432
  protocol = "tcp"
  
  [[services.ports]]
    port = 5432
    handlers = ["pg_tls"]

# Redis
[[services]]
  name = "ai-multichannel-redis"
  internal_port = 6379
  protocol = "tcp"
  
  [[services.ports]]
    port = 6379

# Environment variables
[env]
  APP_NAME = "AI Multichannel System"
  APP_VERSION = "1.0.0"
  APP_ENV = "production"
  DEBUG = "false"
  HOST = "0.0.0.0"
  PORT = "8000"
  CORS_ORIGINS = "*"
  SECRET_KEY = "${SECRET_KEY}"
  
  # Database
  DATABASE_URL = "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@ai-multichannel-db:5432/ai_multichannel"
  REDIS_URL = "redis://ai-multichannel-redis:6379/0"
  
  # AI Configuration
  OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"
  OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
  DEFAULT_AI_MODEL = "mistralai/mistral-7b-instruct"
  
  # Object Storage
  S3_BUCKET = "${S3_BUCKET}"
  S3_REGION = "${S3_REGION}"
  S3_ACCESS_KEY_ID = "${S3_ACCESS_KEY_ID}"
  S3_SECRET_ACCESS_KEY = "${S3_SECRET_ACCESS_KEY}"
  S3_ENDPOINT_URL = "${S3_ENDPOINT_URL}"
  S3_PUBLIC_URL_BASE = "${S3_PUBLIC_URL_BASE}"
  PUBLIC_API_BASE_URL = "https://ai-multichannel-system.fly.dev"
  
  # Twilio Configuration
  TWILIO_ACCOUNT_SID = "${TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN = "${TWILIO_AUTH_TOKEN}"
  TWILIO_PHONE_NUMBER = "${TWILIO_PHONE_NUMBER}"
  
  # ElevenLabs Configuration
  ELEVENLABS_API_KEY = "${ELEVENLABS_API_KEY}"
  ELEVENLABS_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"

# Scaling configuration
[processes]
  api = "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"
  celery = "celery -A src.tasks worker --loglevel=info"

# Scale to multiple regions for global availability
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
  
# Deploy to multiple regions
[deploy]
  strategy = "rolling"
  max_unavailable = 1
  
# Regions to deploy to
[[deploy.regions]]
  name = "iad"  # US East
  
[[deploy.regions]]
  name = "ewr"  # US East (New Jersey)
  
[[deploy.regions]]
  name = "sin"  # Asia (Singapore)
  
[[deploy.regions]]
  name = "ams"  # Europe (Amsterdam)

# Health checks
[[checks]]
  name = "health-check"
  type = "http"
  interval = "30s"
  timeout = "10s"
  path = "/health"
  port = 8000

# Metrics
[metrics]
  port = 9090
  path = "/metrics"
