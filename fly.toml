# Fly.io configuration for AI Multichannel System

app = "ai-multichannel-system"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  target = "production"

[env]
  APP_NAME = "AI Multichannel System"
  APP_VERSION = "1.0.0"
  APP_ENV = "production"
  DEBUG = "false"
  HOST = "0.0.0.0"
  PORT = "8000"
  CORS_ORIGINS = "*"
  OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
  DEFAULT_AI_MODEL = "mistralai/mistral-7b-instruct"
  PUBLIC_API_BASE_URL = "https://ai-multichannel-system.fly.dev"
  ELEVENLABS_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"

# Secrets (DATABASE_URL, REDIS_URL, SECRET_KEY, S3_*, API keys):
# fly secrets set KEY=value ...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[processes]
  app = "python -m uvicorn src.main:app --host 0.0.0.0 --port 8000"

[[vm]]
  memory_mb = 1024
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "rolling"
  max_unavailable = 1
