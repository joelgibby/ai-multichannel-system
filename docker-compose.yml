# AI Multichannel System - Docker Compose (development)
# Usage:
#   cp .env.example .env   # optional but recommended for API keys
#   docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ai-multichannel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AI Multichannel System
      APP_VERSION: "1.0.0"
      APP_ENV: development
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_multichannel
      REDIS_URL: redis://redis:6379/0
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-mistralai/mistral-nemo}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
    volumes:
      - ./backend:/app
      - api_storage:/tmp/ai-multichannel-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:15-alpine
    container_name: ai-multichannel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_multichannel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/infra/init-db-v2.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-multichannel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ai-multichannel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ai-network

  # Optional: enable with `docker compose --profile workers up`
  celery:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ai-multichannel-celery
    restart: unless-stopped
    command: celery -A src.tasks worker --loglevel=info
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_multichannel
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ai-network

volumes:
  postgres_data:
  redis_data:
  api_storage:
  frontend_node_modules:
  frontend_next:

networks:
  ai-network:
    driver: bridge
