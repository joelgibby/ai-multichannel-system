# AI Multichannel System - Docker Compose Configuration
# This file defines the complete infrastructure for development and production

version: '3.8'

services:
  # ============================================
  # Backend API Service
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ai-multichannel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Multichannel System
      - APP_VERSION=1.0.0
      - APP_ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=*
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ai_multichannel
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      # AI Configuration
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - DEFAULT_AI_MODEL=mistralai/mistral-7b-instruct
      # IPFS Configuration
      - WEB3_STORAGE_TOKEN=${WEB3_STORAGE_TOKEN:-}
      - IPFS_GATEWAY_URL=https://ipfs.io/ipfs
      # Twilio Configuration
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      # ElevenLabs Configuration
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=21m00Tcm4TlvDq8ikWAM
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: ai-multichannel-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_multichannel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/infra/init-db-v2.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache & Message Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ai-multichannel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Celery Worker for Background Tasks
  # ============================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ai-multichannel-celery
    restart: unless-stopped
    command: celery -A src.tasks worker --loglevel=info
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ai_multichannel
      - REDIS_URL=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - WEB3_STORAGE_TOKEN=${WEB3_STORAGE_TOKEN:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - db
    networks:
      - ai-network

  # ============================================
  # Frontend Service (React/Next.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-multichannel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - ai-network

  # ============================================
  # Nginx Reverse Proxy (Production)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: ai-multichannel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - ai-network
    profiles:
      - production

  # ============================================
  # IPFS Node (Optional - for self-hosted IPFS)
  # ============================================
  ipfs:
    image: ipfs/kubo:latest
    container_name: ai-multichannel-ipfs
    restart: unless-stopped
    volumes:
      - ipfs_data:/data/ipfs
    ports:
      - "4001:4001"  # Swarm
      - "4001:4001/udp"  # Swarm UDP
      - "8080:8080"  # Gateway
      - "5001:5001"  # API
    networks:
      - ai-network
    profiles:
      - ipfs

  # ============================================
  # Monitoring with Prometheus & Grafana
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-multichannel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: ai-multichannel-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ai-network
    profiles:
      - monitoring

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  redis_data:
  ipfs_data:
  prometheus_data:
  grafana_data:

# ============================================
# Networks
# ============================================
networks:
  ai-network:
    driver: bridge
